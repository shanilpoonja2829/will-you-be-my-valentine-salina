<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salina, my jaan, will you be my Valentine?</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root {
  --bg1: #ffd6e7;
  --bg2: #ffeef6;
  --card: rgba(255,255,255,0.85);
  --yes: #ff3b7a;
}

* { box-sizing: border-box; margin:0; padding:0; }

body {
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  padding: 16px;
  background: #ffeef6;
}

.bg {
  position: fixed;
  inset: 0;
  background: url('us.jpg') center/cover no-repeat;
  z-index: -2;
}

.bg-gradient {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  opacity: 0.6;
  z-index: -1;
}

#confettiCanvas {
  position: fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9999;
}

.card {
  width: min(720px, 92vw);
  padding: 26px 22px;
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 18px 60px rgba(0,0,0,.15);
  position: relative;
}

h1 { font-size: clamp(26px, 4vw, 44px); margin-bottom: 18px; }

.button-zone {
  position: relative;
  width: 100%;
  height: 170px;
  margin: 0 auto;
  touch-action: none;
}

button {
  position: absolute;
  top:50%;
  transform: translateY(-50%);
  padding: 16px 26px;
  font-size:18px;
  font-weight:800;
  border-radius:999px;
  border:none;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.14);
  user-select:none;
  transition: transform 0.15s ease;
}

#yesBtn {
  left: 15%;
  background: var(--yes);
  color: #fff;
  overflow: visible;
}
#yesBtn span {
  display:inline-block;
}
#yesBtn.pulsing span {
  animation: yesPulse 1.2s ease-in-out infinite;
}

@keyframes yesPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

#noBtn {
  left: 60%;
  background: #e5e7eb;
  color: #111827;
}

.hint {
  margin-top:10px;
  font-size:13px;
  opacity:.75;
}

.result {
  display:none;
  margin-top:18px;
  animation: pop .4s ease;
}

.love-note {
  font-size:18px;
  margin-top:12px;
  line-height:1.5;
}

@keyframes pop {
  from { transform: scale(.96); opacity:0; }
  to   { transform: scale(1); opacity:1; }
}

/* Floating hearts */
.heart {
  position: fixed;
  pointer-events: none;
  font-size:20px;
  animation: floatUp 1s ease forwards;
  text-shadow: 0 0 4px #fff;
}
@keyframes floatUp {
  from { transform: translate(-50%,-50%) scale(1); opacity:1; }
  to   { transform: translate(-50%,-120%) scale(1.6); opacity:1; }
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-gradient"></div>
<canvas id="confettiCanvas"></canvas>

<audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

<main class="card">
  <h1>Salina, my jaan, will you be my Valentine?</h1>

  <section class="button-zone" id="zone">
    <button id="yesBtn" aria-label="Yes, I will"><span>Yes</span></button>
    <button id="noBtn" aria-label="No, I won't">No</button>
  </section>

  <div class="hint" id="hint">Looks like “No” is shy like my Sallu 😈</div>

  <section class="result" id="result" aria-live="polite">
    <h2>YAY, BABY! 💖</h2>
    <p class="love-note">
      You make the ordinary feel magical. Every smile, every moment - I want to choose you, always. So this is the part where I smile like an idiot because you said yes 💕
    </p>
    <img src="https://media.giphy.com/media/3rgXBxX4myufzT6N2w/giphy.gif" alt="Celebration" style="width:90%;max-width:360px;margin-top:10px">
  </section>
</main>

<script>
const zone = document.getElementById("zone");
const yesBtn = document.getElementById("yesBtn");
const yesSpan = yesBtn.querySelector("span");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");
const hint = document.getElementById("hint");
const music = document.getElementById("bgMusic");
const confettiCanvas = document.getElementById("confettiCanvas");

const hints = [
  "Looks like “No” is shy like my Sallu 😈",
  "Still running away, huh? 😏",
  "Okay now you’re teasing 💕",
  "At this point it’s destiny 💘",
  "Just say yes already 😌"
];
let hintIndex = 0;

// Start pulsing immediately
yesBtn.classList.add("pulsing");

// Yes growth
let yesScale = 1;
function growYes() {
  yesScale = Math.min(2.5, yesScale + 0.15); 
  yesSpan.style.transform = `scale(${yesScale})`;
}

// Floating hearts
let heartsCount = 0;
function spawnHeart(x,y){
  if(heartsCount>30) return;
  heartsCount++;
  const h=document.createElement("div");
  h.className="heart";
  h.textContent = Math.random()>0.5?"💖":"💕";
  h.style.left=x+"px";
  h.style.top=y+"px";
  document.body.appendChild(h);
  setTimeout(()=>{h.remove();heartsCount--;},1200);
}

// Confetti setup
function resizeConfetti(){
  const dpr=devicePixelRatio||1;
  confettiCanvas.width=innerWidth*dpr;
  confettiCanvas.height=innerHeight*dpr;
  confettiCanvas.getContext("2d").setTransform(dpr,0,0,dpr,0,0);
}
resizeConfetti();
addEventListener("resize",resizeConfetti);
const confettiInstance = confetti.create(confettiCanvas,{resize:false,useWorker:true});
function megaConfetti(){
  const end=Date.now()+3000;
  (function frame(){
    confettiInstance({
      particleCount:18,
      spread:120,
      startVelocity:55,
      shapes:["heart"],
      colors:["#ff4d7d","#ff1f68","#ff9bb8","#ffd1dc"],
      origin:{x:Math.random(),y:Math.random()*0.4}
    });
    if(Date.now()<end) requestAnimationFrame(frame);
  })();
}

// Clamp helper
function clamp(n,min,max){return Math.max(min,Math.min(max,n));}

// Track pointer for heart trail
let lastEvent;
zone.addEventListener("pointermove", e=>{
  lastEvent=e;
  spawnHeart(e.clientX,e.clientY);
});

// Move No on click/tap
zone.addEventListener("pointerdown", e=>{
  hintIndex = Math.min(hintIndex+1,hints.length-1);
  hint.textContent = hints[hintIndex];

  const zoneRect = zone.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();
  let dx=(btnRect.left+btnRect.width/2)-e.clientX;
  let dy=(btnRect.top+btnRect.height/2)-e.clientY;
  let mag=Math.hypot(dx,dy)||1;
  dx/=mag; dy/=mag;
  let left=clamp((btnRect.left-zoneRect.left)+dx*180,0,zoneRect.width-btnRect.width);
  let top=clamp((btnRect.top-zoneRect.top)+dy*180,0,zoneRect.height-btnRect.height);
  noBtn.style.left=left+"px";
  noBtn.style.top=top+"px";

  growYes();
});

// Yes click
yesBtn.addEventListener("click", async ()=>{
  if("vibrate" in navigator) navigator.vibrate(100);
  try{music.volume=0; await music.play();}catch{}
  let v=0;
  const fade=setInterval(()=>{
    v+=0.05;
    music.volume=Math.min(v,0.6);
    if(v>=0.6) clearInterval(fade);
  },80);
  zone.style.display="none";
  hint.style.display="none";
  result.style.display="block";
  resizeConfetti();
  megaConfetti();
});
</script>
</body>
</html>
