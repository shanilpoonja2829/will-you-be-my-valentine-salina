<body>
<canvas id="confettiCanvas"></canvas>

<audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

<main class="card">
  <h1>Salina, my jaan, will you be my Valentine?</h1>

  <section class="button-zone" id="zone">
    <button id="yesBtn" aria-label="Yes, I will">Yes</button>
    <button id="noBtn" aria-label="No, I won't">No</button>
  </section>

  <div class="hint" id="hint">Looks like “No” is shy like my Sallu 😈</div>

  <section class="result" id="result" aria-live="polite">
    <h2>YAY, BABY! 💖</h2>
    <p class="love-note">
      You make the ordinary feel magical. Every smile, every moment - I want to choose you, always. So this is the part where I smile like an idiot because you said yes 💕
    </p>
    <img
      src="https://media.giphy.com/media/3rgXBxX4myufzT6N2w/giphy.gif"
      alt="Celebration"
      style="width:90%;max-width:360px;margin-top:10px"
    />
  </section>
</main>

<script>
const zone = document.getElementById("zone");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const result = document.getElementById("result");
const hint = document.getElementById("hint");
const music = document.getElementById("bgMusic");
const confettiCanvas = document.getElementById("confettiCanvas");

// Yes button pulsing
yesBtn.classList.add("pulsing");
let yesScale = 1;
function growYes() {
  yesScale = Math.min(2.5, yesScale + 0.15);
  yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
}

// Hearts
let heartsCount = 0;
function spawnHeart(x, y) {
  if (heartsCount > 30) return;
  heartsCount++;
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = Math.random() > 0.5 ? "💖" : "💕";
  h.style.left = x + "px";
  h.style.top = y + "px";
  document.body.appendChild(h);
  setTimeout(() => { h.remove(); heartsCount--; }, 1000);
}

// Confetti
function resizeConfetti() {
  const dpr = devicePixelRatio || 1;
  confettiCanvas.width = innerWidth * dpr;
  confettiCanvas.height = innerHeight * dpr;
  confettiCanvas.getContext("2d").setTransform(dpr,0,0,dpr,0,0);
}
resizeConfetti();
addEventListener("resize", resizeConfetti);

const confettiInstance = confetti.create(confettiCanvas, {resize:false, useWorker:true});
function megaConfetti() {
  const end = Date.now() + 3000;
  (function frame() {
    confettiInstance({ particleCount:18, spread:120, startVelocity:55, shapes:["heart"], colors:["#ff4d7d","#ff1f68","#ff9bb8","#ffd1dc"], origin:{x:Math.random(),y:Math.random()*0.4}});
    if(Date.now()<end) requestAnimationFrame(frame);
  })();
}

// Move No button
function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function moveNo(x,y){
  const zoneRect = zone.getBoundingClientRect();
  const btnRect = noBtn.getBoundingClientRect();

  let dx = (btnRect.left + btnRect.width/2) - x;
  let dy = (btnRect.top + btnRect.height/2) - y;
  let mag = Math.hypot(dx,dy)||1;
  dx/=mag; dy/=mag;

  let left = clamp((btnRect.left - zoneRect.left) + dx*180, 0, zoneRect.width-btnRect.width);
  let top  = clamp((btnRect.top - zoneRect.top) + dy*180, 0, zoneRect.height-btnRect.height);

  noBtn.style.left = left + "px";
  noBtn.style.top = top + "px";

  growYes();
}

// Pointer move triggers floating hearts + No button movement
zone.addEventListener("pointermove", e => {
  spawnHeart(e.clientX, e.clientY);
  moveNo(e.clientX, e.clientY);
});

// Hint updates on clicking No
const hints = [
  "Looks like “No” is shy like my Sallu 😈",
  "Still running away, huh? 😏",
  "Okay now you’re teasing 💕",
  "At this point it’s destiny 💘",
  "Just say yes already 😌"
];
let hintIndex = 0;
noBtn.addEventListener("pointerdown", () => {
  hintIndex = Math.min(hintIndex + 1, hints.length-1);
  hint.textContent = hints[hintIndex];
});

// Yes click
yesBtn.addEventListener("click", async () => {
  if("vibrate" in navigator) navigator.vibrate(100);
  try { music.volume=0; await music.play(); } catch {}
  let v=0; const fade=setInterval(()=>{ v+=0.05; music.volume=Math.min(v,0.6); if(v>=0.6) clearInterval(fade); },80);

  zone.style.display="none";
  hint.style.display="none";
  result.style.display="block";

  resizeConfetti();
  megaConfetti();
});
</script>
</body>
