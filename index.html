<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Salina, my jaan, will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 170px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 26px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn {
      left: 15%;
      background: var(--yes);
      color: #fff;
    }

    #noBtn {
      left: 60%;
      background: #e5e7eb;
      color: #111827;
      pointer-events: none; /* 🔒 impossible to tap */
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .4s ease;
    }

    .love-note {
      font-size: 18px;
      margin-top: 12px;
      line-height: 1.5;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <!-- 🎵 MUSIC -->
  <audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

  <main class="card">
    <h1>Salina, my jaan, will you be my Valentine?</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">Looks like “No” is too shy like my Sallu 😈</div>

    <section class="result" id="result">
      <h2>YAY, BABY! 💖</h2>
      <p class="love-note">
        You make the ordinary feel magical. Every smile, every moment - I want to choose you, always.  
        So this is the part where I smile like an idiot because you said yes 💕
      </p>
      <img
        src="https://media.giphy.com/media/3rgXBxX4myufzT6N2w/giphy.gif"
        style="width:90%;max-width:360px;margin-top:10px"
      />
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const music = document.getElementById("bgMusic");
    const confettiCanvas = document.getElementById("confettiCanvas");

    function resizeConfettiCanvas() {
      const dpr = window.devicePixelRatio || 1;
      confettiCanvas.width = innerWidth * dpr;
      confettiCanvas.height = innerHeight * dpr;
    }

    resizeConfettiCanvas();
    addEventListener("resize", resizeConfettiCanvas);

    const confettiInstance = confetti.create(confettiCanvas, {
      resize: false,
      useWorker: true
    });

    function heartConfetti() {
      const end = Date.now() + 1800;
      (function frame() {
        confettiInstance({
          particleCount: 8,
          spread: 100,
          startVelocity: 40,
          shapes: ["heart"],
          colors: ["#ff4d7d", "#ff1f68", "#ff9bb8"],
          origin: { x: Math.random(), y: Math.random() * 0.3 }
        });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    let yesScale = 1;
    function growYes() {
      yesScale = Math.min(2.5, yesScale + 0.15);
      yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function moveNo(x, y) {
      const z = zone.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();

      let dx = (b.left + b.width / 2) - x;
      let dy = (b.top + b.height / 2) - y;
      let mag = Math.hypot(dx, dy) || 1;
      dx /= mag;
      dy /= mag;

      let left = clamp((b.left - z.left) + dx * 180, 0, z.width - b.width);
      let top  = clamp((b.top - z.top) + dy * 180, 0, z.height - b.height);

      noBtn.style.left = left + "px";
      noBtn.style.top = top + "px";
      noBtn.style.transform = "none";

      growYes();
    }

    zone.addEventListener("pointermove", e => {
      moveNo(e.clientX, e.clientY);
    });

    function heartbeat() {
      if (!navigator.vibrate) return;
      navigator.vibrate([80, 40, 120]);
    }

    yesBtn.addEventListener("click", async () => {
      music.volume = 0;
      await music.play();

      let v = 0;
      const fade = setInterval(() => {
        v += 0.05;
        music.volume = Math.min(v, 0.6);
        if (v >= 0.6) clearInterval(fade);
      }, 80);

      heartbeat();
      setInterval(heartbeat, 1400);

      zone.style.display = "none";
      hint.style.display = "none";
      result.style.display = "block";

      resizeConfettiCanvas();
      heartConfetti();
    });
  </script>
</body>
</html>
