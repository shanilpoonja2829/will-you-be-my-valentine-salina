<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salina, my jaan, will you be my Valentine?</title>

<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root {
  --bg1: #ffd6e7;
  --bg2: #ffeef6;
  --card: rgba(255,255,255,0.18);
  --yes: #ff3b7a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100svh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, sans-serif;
  overflow: hidden;
  padding: 16px;
  background: #ffeef6;
}

.bg {
  position: fixed;
  inset: 0;
  background-image: url('./Us.JPG');
  background-size: cover;
  background-position: center 39%;
  background-repeat: no-repeat;
  z-index: -2;
}

.bg-gradient {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, var(--bg2), var(--bg1));
  opacity: 0.6;
  z-index: -1;
}

#confettiCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
}

.card {
  width: min(900px, 92vw);
  padding: 32px 28px;
  background: var(--card);
  backdrop-filter: blur(10px);
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 18px 60px rgba(0,0,0,.15);
  position: relative;
  transform: translateY(8vh);
}

h1 {
  font-size: clamp(26px, 4vw, 44px);
  margin-bottom: 18px;
}

.button-zone {
  display: flex;
  justify-content: space-around;
  align-items: center;
  width: 100%;
  height: 170px;
  margin: 0 auto;
  touch-action: none;
  position: relative;
}

#yesWrapper {
  display: inline-block;
  transition: transform 0.2s ease;
}

button {
  position: relative;
  padding: 16px 32px;
  font-size: 18px;
  font-weight: 800;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  box-shadow: 0 10px 24px rgba(0,0,0,.14);
  user-select: none;
  transition: transform 0.2s ease, left 0.3s ease, top 0.3s ease;
  white-space: nowrap;
}

#yesBtn {
  background: var(--yes);
  color: #fff;
}
#yesBtn.pulsing {
  animation: yesPulse 1.2s ease-in-out infinite;
}
@keyframes yesPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}

#noBtn {
  background: #e5e7eb;
  color: #111827;
}

.hint {
  margin-top: 10px;
  font-size: 13px;
  opacity: .75;
}

.result {
  display: none;
  margin-top: 18px;
  animation: pop .4s ease;
}

.love-note {
  font-size: 18px;
  margin-top: 12px;
  line-height: 1.5;
}

@keyframes pop {
  from { transform: scale(.96); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.heart {
  position: fixed;
  pointer-events: none;
  font-size: 28px;
  animation: floatUp 1s ease forwards;
  text-shadow: 0 0 6px #ffb6c1, 0 0 12px #ff69b4;
  opacity: 0.9;
}
@keyframes floatUp {
  from { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  to   { transform: translate(-50%,-120%) scale(1.6); opacity: 1; }
}
</style>
</head>

<body>
<div class="bg"></div>
<div class="bg-gradient"></div>
<canvas id="confettiCanvas"></canvas>

<audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

<main class="card">
  <h1>Salina, my jaan, will you be my Valentine?</h1>

  <section class="button-zone" id="zone">
    <div id="yesWrapper">
      <button id="yesBtn">Yes</button>
    </div>
    <button id="noBtn">No</button>
  </section>

  <div class="hint" id="hint">Looks like “No” is shy like my Sallu 😈</div>

  <section class="result" id="result">
    <h2>YAY, BABY! 💖</h2>
    <p class="love-note">
      You make the ordinary feel magical. Every smile, every moment - I want to choose you, always.
    </p>
  </section>
</main>

<script defer>
window.addEventListener("load", () => {

  const zone = document.getElementById("zone");
  const yesBtn = document.getElementById("yesBtn");
  const yesWrapper = document.getElementById("yesWrapper");
  const noBtn = document.getElementById("noBtn");
  const hint = document.getElementById("hint");
  const result = document.getElementById("result");
  const music = document.getElementById("bgMusic");
  const confettiCanvas = document.getElementById("confettiCanvas");

  const hints = [
    "Looks like “No” is shy like my Sallu 😈",
    "Still running away, huh babe? 😏",
    "Okay now you’re teasing jaan 💕",
    "At this point it’s destiny beautiful 💘",
    "Baby just say yes already 😌"
  ];
  let hintIndex = 0;

  yesBtn.classList.add("pulsing");

  let yesScale = 1;
  function growYes() {
    yesScale = Math.min(2.5, yesScale + 0.15);
    yesWrapper.style.transform = `scale(${yesScale})`;
  }

  let heartsCount = 0;
  function spawnHeart(x,y){
    if(heartsCount > 30) return;
    heartsCount++;
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = Math.random() > 0.5 ? "💖" : "💕";
    h.style.left = x + "px";
    h.style.top = y + "px";
    document.body.appendChild(h);
    setTimeout(() => { h.remove(); heartsCount--; }, 1200);
  }

  /* ADDITION 1: heart burst (uses existing hearts only) */
  function heartBurst(x,y){
    for(let i=0;i<16;i++){
      setTimeout(() => {
        spawnHeart(
          x + (Math.random()-0.5)*120,
          y + (Math.random()-0.5)*120
        );
      }, i*30);
    }
  }

  function resizeConfetti(){
    const dpr = devicePixelRatio || 1;
    confettiCanvas.width = innerWidth * dpr;
    confettiCanvas.height = innerHeight * dpr;
    confettiCanvas.getContext("2d").setTransform(dpr,0,0,dpr,0,0);
  }
  resizeConfetti();
  addEventListener("resize", resizeConfetti);

  const confettiInstance = confetti.create(confettiCanvas, { resize:false, useWorker:false });

  /* ADDITION 2: more confetti (same function, just stronger) */
  function megaConfetti(){
    const end = Date.now() + 4500;
    (function frame(){
      confettiInstance({
        particleCount: 40,
        spread: 140,
        startVelocity: 60,
        colors: ["#ff4d7d","#ff1f68","#ff9bb8","#ffd1dc"],
        origin: { x: Math.random(), y: Math.random()*0.5 }
      });
      if(Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

  zone.addEventListener("pointermove", e => {
    spawnHeart(e.clientX, e.clientY);

    const r = noBtn.getBoundingClientRect();
    const d = Math.hypot(
      e.clientX - (r.left + r.width/2),
      e.clientY - (r.top + r.height/2)
    );

    if(d < 100){
      growYes();
      hintIndex = Math.min(hints.length-1, hintIndex+1);
      hint.textContent = hints[hintIndex];

      const z = zone.getBoundingClientRect();
      const dx = (r.left + r.width/2) - e.clientX;
      const dy = (r.top + r.height/2) - e.clientY;
      const mag = Math.hypot(dx,dy) || 1;

      noBtn.style.position = "absolute";
      noBtn.style.left = clamp((r.left - z.left) + (dx/mag)*180, 0, z.width-r.width) + "px";
      noBtn.style.top  = clamp((r.top - z.top) + (dy/mag)*180, 0, z.height-r.height) + "px";
    }
  });

  yesBtn.addEventListener("click", async () => {
    try { music.volume = 0; await music.play(); } catch {}
    zone.style.display = "none";
    hint.style.display = "none";
    result.style.display = "block";

    /* ADDITION 3: hearts + more confetti */
    heartBurst(innerWidth/2, innerHeight/2);
    megaConfetti();
  });

});
</script>
</body>
</html>
